<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무료 진단 | 병원 마케팅 대행</title><link rel="stylesheet" href="assets/style.css"><script src="assets/config.js"></script><script src="assets/diag.js"></script>
<style>.ph{background:var(--bg);padding:54px 0 34px;border-bottom:1px solid var(--line)}.ph h1{font-size:2.3em;line-height:1.3;margin:6px 0 10px;letter-spacing:-.03em}.ph h1 em{font-style:normal;color:var(--ac)}
.sr{position:relative;max-width:620px}.sr input{padding:15px 18px;font-size:1.1em;border-radius:13px}.dd{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:6px;box-shadow:0 12px 30px rgba(16,24,40,.12);z-index:5;max-height:380px;overflow:auto}
.dd div{padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--line)}.dd div:hover{background:#f2f4ff}.dd small{color:var(--mu)}</style><meta property="og:image" content="https://clickmedi.clickdew.com/assets/img/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://clickmedi.clickdew.com/assets/img/og.png"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png"><link rel="icon" type="image/png" sizes="48x48" href="assets/img/favicon-48.png"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png"><meta name="theme-color" content="#0a0f33"></head><body>
<div class="ph"><div class="wrap"><div class="eyebrow">FREE DIAGNOSIS</div><h1>우리 병원,<br><em>지역 검색에서 어디에 있을까요?</em></h1><p class="lead" style="margin:0 0 20px">병원 이름만 입력하세요. 네이버 지도·블로그 검색 순위, 채널 보유 현황, 같은 지역 경쟁 병원과의 차이를 보여 드립니다. (시흥·안산, 인천 연수구·남동구 병원 대상)</p>
<div class="sr"><input id="q" placeholder="병원 이름 또는 동 이름 (예: 더예쁨, 배곧 치과, 송도 피부과, 구월동)" autocomplete="off"><div class="dd" id="dd" style="display:none"></div></div></div></div>
<section class="s"><div class="wrap"><div id="out"><p class="mu">검색 결과가 여기에 표시됩니다. 목록에 없는 병원이라면 상담 신청으로 알려 주세요. 직접 조사해 드립니다.</p></div>
<div id="cta" style="display:none;margin-top:22px" class="card"><b>진단 결과로 무엇을 할 수 있을까요?</b><p style="margin-top:4px">필요한 항목만 골라 가격을 확인하거나, 이 진단으로 상담을 신청해 보세요.</p><div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><a class="btn dark" href="price.html">가격·견적 보기</a><a class="btn" href="index.html#contact" id="goc">이 진단으로 상담 신청</a></div></div></div></section>
<script>
HB.chrome("pub","diagnose.html");let D;const $=id=>document.getElementById(id);
DIAG.load("").then(d=>{D=d;const p=new URLSearchParams(location.search).get("id");if(p){const h=D.hospitals.find(x=>x.id===p);if(h)show(h)}});
function show(h){$("dd").style.display="none";$("q").value=h.name;$("out").innerHTML=DIAG.render(h,D,{blur:true});$("cta").style.display="block";sessionStorage.setItem("hb_quote_text",`[무료 진단 결과] ${h.name} (${h.city} ${h.dong} ${h.dept}) 노출점수 ${h.score.total}/100`)}
$("q").oninput=e=>{if(!D)return;const r=DIAG.find(D.hospitals,e.target.value);const dd=$("dd");if(!r.length){dd.style.display="none";return}dd.style.display="block";dd.innerHTML=r.map(h=>`<div data-id="${h.id}"><b>${HB.esc(h.name)}</b> <small>${h.city} ${HB.esc(h.dong)} · ${h.dept}</small></div>`).join("");dd.querySelectorAll("div").forEach(el=>el.onclick=()=>show(D.hospitals.find(x=>x.id===el.dataset.id)))};
</script></body></html>
